# Builds the static export and publishes it to Firebase Hosting.
#
# Everything here runs on GitHub's infrastructure, and Hosting deploys are
# included in Firebase's free Spark plan, so none of this requires Blaze.
# That stays true only as long as the site remains a static export: adding a
# Server Action, route handler or middleware would push the deploy onto Cloud
# Functions, which does require the paid plan.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while a deploy is running cancels the first; the newest commit
# is the one that should end up live.
concurrency:
  group: hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci


      # next/font/google downloads font files at build time and caches them
      # here, so most builds make no request to Google at all.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        env:
          # NEXT_PUBLIC_* values are inlined into the client bundle at build
          # time, so none of them are secret. They live in GitHub as repo
          # variables; the fallback keeps the build green before they are set.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://nowmagnate-1f5f3.web.app' }}
          NEXT_PUBLIC_STRIPE_PAYMENT_LINK: ${{ vars.NEXT_PUBLIC_STRIPE_PAYMENT_LINK }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_FORM_RELAY_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_RELAY_ENDPOINT }}
          NEXT_PUBLIC_FORM_RELAY_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_FORM_RELAY_ACCESS_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        # The Google Fonts download occasionally returns an unparseable
        # response and crashes the build ("Cannot read properties of null
        # (reading '1')" in next/font). That is transient, so retry the build
        # a couple of times before calling it a failure. A real compile error
        # fails all three attempts and still fails the job.
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      # Runs after the build on purpose: verify ends with check:templates,
      # which inspects out/preview and fails on a clean checkout otherwise.
      - name: Verify
        run: npm run verify

      # `channelId: live` publishes to the production site. Only hosting is
      # deployed, so the Firestore rules in firebase.json are never touched.
      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: nowmagnate-1f5f3
          channelId: live
