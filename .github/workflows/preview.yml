# Publishes each pull request to a temporary Hosting preview channel and posts
# the URL as a PR comment. Preview channels are part of Hosting and included
# in the free Spark plan.
name: Preview PR

on:
  pull_request:

concurrency:
  group: hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Pull requests from forks cannot read repository secrets, so the deploy
    # step would fail with an unhelpful auth error. Skip them instead.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci


      # next/font/google downloads font files at build time and caches them
      # here, so most builds make no request to Google at all.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        env:
          # Preview builds are not the canonical origin, so the site URL is
          # left at its default rather than pointing sitemap/robots at a
          # throwaway channel domain.
          NEXT_PUBLIC_PAYMENTS_API_URL: ${{ vars.NEXT_PUBLIC_PAYMENTS_API_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_FORM_RELAY_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_RELAY_ENDPOINT }}
          NEXT_PUBLIC_FORM_RELAY_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_FORM_RELAY_ACCESS_KEY }}
        # The Google Fonts download occasionally returns an unparseable
        # response and crashes the build ("Cannot read properties of null
        # (reading '1')" in next/font). That is transient, so retry the build
        # a couple of times before calling it a failure. A real compile error
        # fails all three attempts and still fails the job.
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      # Runs after the build on purpose: verify ends with check:templates,
      # which inspects out/preview and fails on a clean checkout otherwise.
      - name: Verify
        run: npm run verify

      - name: Deploy preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: nowmagnate-1f5f3
          expires: 7d
